<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 680" width="1000" height="680" font-family="Helvetica, Arial, sans-serif" font-size="14">
  <title>Gene 1.0 - Pi 5, MAX98357A amp and speakers wiring</title>
  <rect width="1000" height="680" fill="#ffffff"/>
  <text x="40" y="40" font-size="20" font-weight="bold" fill="#1a1a1a">Audio: Raspberry Pi 5 → MAX98357A → 2 × 8 Ω speakers</text>
  <text x="40" y="62" font-size="13" fill="#555">Amp plugs into the 2nd header of the 1-to-2 GPIO splitter (the crown ribbon uses the 1st). Physical pin numbers.</text>

  <!-- Pi 5 header block -->
  <rect x="40" y="90" width="260" height="430" rx="10" fill="#e8f3ea" stroke="#2e7d32" stroke-width="2"/>
  <text x="60" y="118" font-weight="bold" fill="#1b5e20">Raspberry Pi 5</text>
  <text x="60" y="136" font-size="12" fill="#2e7d32">GPIO header (via splitter)</text>
  <g font-size="13" fill="#1a1a1a" text-anchor="end">
    <text x="288" y="165">pin 4 · 5 V</text>
    <text x="288" y="215">pin 6 · GND</text>
    <text x="288" y="295">pin 12 · GPIO 18 (PCM CLK)</text>
    <text x="288" y="365">pin 35 · GPIO 19 (PCM FS)</text>
    <text x="288" y="435">pin 40 · GPIO 21 (PCM DOUT)</text>
  </g>
  <g fill="#1a1a1a"><circle cx="300" cy="160" r="4"/><circle cx="300" cy="210" r="4"/><circle cx="300" cy="290" r="4"/><circle cx="300" cy="360" r="4"/><circle cx="300" cy="430" r="4"/></g>

  <!-- MAX98357A block -->
  <rect x="520" y="90" width="200" height="430" rx="10" fill="#e6effa" stroke="#1565c0" stroke-width="2"/>
  <text x="540" y="118" font-weight="bold" fill="#0d47a1">MAX98357A</text>
  <text x="540" y="136" font-size="12" fill="#1565c0">I2S class-D amp, mono</text>
  <g font-size="13" fill="#1a1a1a">
    <text x="532" y="165">Vin</text>
    <text x="532" y="215">GND</text>
    <text x="532" y="250">SD</text>
    <text x="532" y="295">BCLK</text>
    <text x="532" y="365">LRC</text>
    <text x="532" y="435">DIN</text>
    <text x="532" y="490">GAIN</text>
  </g>
  <g font-size="12" fill="#777" font-style="italic">
    <text x="575" y="250">open (see note 3)</text>
    <text x="575" y="490">open = 9 dB</text>
  </g>
  <g font-size="16" font-weight="bold" fill="#1a1a1a" text-anchor="end">
    <text x="710" y="256">+</text>
    <text x="710" y="476">−</text>
  </g>
  <g fill="#1a1a1a"><circle cx="520" cy="160" r="4"/><circle cx="520" cy="210" r="4"/><circle cx="520" cy="245" r="4" fill="#fff" stroke="#1a1a1a" stroke-width="1.5"/><circle cx="520" cy="290" r="4"/><circle cx="520" cy="360" r="4"/><circle cx="520" cy="430" r="4"/><circle cx="520" cy="485" r="4" fill="#fff" stroke="#1a1a1a" stroke-width="1.5"/><circle cx="720" cy="250" r="4"/><circle cx="720" cy="470" r="4"/></g>

  <!-- Pi to amp wires -->
  <g stroke-width="3" fill="none">
    <line x1="304" y1="160" x2="516" y2="160" stroke="#d32f2f"/>
    <line x1="304" y1="210" x2="516" y2="210" stroke="#1a1a1a"/>
    <line x1="304" y1="290" x2="516" y2="290" stroke="#ef8f00"/>
    <line x1="304" y1="360" x2="516" y2="360" stroke="#1976d2"/>
    <line x1="304" y1="430" x2="516" y2="430" stroke="#2e9e5b"/>
  </g>
  <g font-size="12" text-anchor="middle">
    <text x="410" y="152" fill="#d32f2f">5 V</text>
    <text x="410" y="202" fill="#1a1a1a">GND</text>
    <text x="410" y="282" fill="#b86e00">bit clock</text>
    <text x="410" y="352" fill="#1976d2">L/R (word) clock</text>
    <text x="410" y="422" fill="#2e9e5b">audio data</text>
  </g>
  <text x="410" y="470" font-size="12" text-anchor="middle" fill="#555">~75 mm, 26–28 AWG</text>

  <!-- Speakers -->
  <g>
    <rect x="850" y="165" width="22" height="50" fill="#f3f3f3" stroke="#1a1a1a" stroke-width="2"/>
    <polygon points="872,165 905,140 905,240 872,215" fill="#f3f3f3" stroke="#1a1a1a" stroke-width="2"/>
    <text x="915" y="185" font-weight="bold" fill="#1a1a1a">Speaker L</text>
    <text x="915" y="203" font-size="12" fill="#555">28 mm, 8 Ω</text>
    <text x="840" y="176" font-size="14" font-weight="bold" text-anchor="end">+</text>
    <text x="840" y="222" font-size="14" font-weight="bold" text-anchor="end">−</text>
  </g>
  <g>
    <rect x="850" y="385" width="22" height="50" fill="#f3f3f3" stroke="#1a1a1a" stroke-width="2"/>
    <polygon points="872,385 905,360 905,460 872,435" fill="#f3f3f3" stroke="#1a1a1a" stroke-width="2"/>
    <text x="915" y="405" font-weight="bold" fill="#1a1a1a">Speaker R</text>
    <text x="915" y="423" font-size="12" fill="#555">28 mm, 8 Ω</text>
    <text x="840" y="396" font-size="14" font-weight="bold" text-anchor="end">+</text>
    <text x="840" y="442" font-size="14" font-weight="bold" text-anchor="end">−</text>
  </g>

  <!-- Speaker wiring: + net (red), - net (dark) with one hop -->
  <g stroke-width="3" fill="none">
    <path d="M724 250 H760 M760 180 V400 M760 180 H850 M760 400 H850" stroke="#c62828"/>
    <path d="M724 470 H790 V406 A6 6 0 0 0 790 394 V220 H850 M790 440 H850" stroke="#424242"/>
  </g>
  <g fill="#1a1a1a"><circle cx="760" cy="250" r="5" fill="#c62828"/><circle cx="790" cy="440" r="5" fill="#424242"/></g>
  <text x="770" y="535" font-size="12" text-anchor="middle" fill="#555">speakers in parallel = 4 Ω load</text>

  <!-- Notes -->
  <rect x="40" y="560" width="920" height="104" rx="8" fill="#fff8e1" stroke="#f9a825"/>
  <g font-size="13" fill="#1a1a1a">
    <text x="56" y="584">1. The outputs are bridged (BTL): never tie either speaker wire to GND, and never join one output to another amp.</text>
    <text x="56" y="606">2. Pi config: dtparam=i2s=on and dtoverlay=hifiberry-dac in /boot/firmware/config.txt; copy software/pi/asound.conf to /etc/asound.conf.</text>
    <text x="56" y="628">3. SD: leave open on an Adafruit board (its 1 MΩ pull-up gives the (L+R)/2 mono mix). On a clone with no pull-up, add 1 MΩ SD → Vin.</text>
    <text x="56" y="650">4. GPIO 12 (pin 32) stays free for the crown flashlight. Any GND pin works (6, 9, 14, 20, 25, 30, 34, 39).</text>
  </g>
</svg>
