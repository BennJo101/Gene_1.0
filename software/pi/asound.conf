# Gene's audio: one MAX98357A (I2S, mono, GAIN pin left open = 9 dB) on the Pi 5.
# The amp has no volume control of its own, so gain lives here as an ALSA softvol control, "Master".
# Copy to /etc/asound.conf. Needs in /boot/firmware/config.txt:  dtparam=i2s=on  and  dtoverlay=hifiberry-dac
# Check the card name with `aplay -l`; the control appears after the first sound is played.
# Set the level with:  amixer sset Master 70%   (or python3 volume.py 70)

pcm.!default {
    type plug
    slave.pcm "gene_vol"
}

pcm.gene_vol {
    type softvol
    slave.pcm "hw:sndrpihifiberry"
    control {
        name "Master"
        card sndrpihifiberry
    }
    min_dB -40.0
    # Ceiling at 100%: -3 dB keeps each speaker near 0.7 W with two 1 W speakers in parallel.
    # Raise towards 0.0 only with speakers rated 1.5 W or more.
    max_dB -3.0
}
